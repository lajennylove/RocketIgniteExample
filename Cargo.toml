[package]
name = "rocket-ignite-example"
version = "0.0.0"
edition = "2021"
publish = false
default-run = "rocket-ignite-example"

[dependencies]
ignite-panel = { git = "https://github.com/lajennylove/Ignite", rev = "265cb1df1bccc7d8a343b5fa300027e28b8d011d" }
ignite-core = { git = "https://github.com/lajennylove/Ignite", rev = "265cb1df1bccc7d8a343b5fa300027e28b8d011d" }
rocket = { git = "https://github.com/rwf2/Rocket", rev = "3a54d079" }
propel_rocket = { git = "https://github.com/lajennylove/propel", rev = "71ecd1c0c9676db74ce0c90ea3578a12fc043f21" }
propel_runtime = { git = "https://github.com/lajennylove/propel", rev = "71ecd1c0c9676db74ce0c90ea3578a12fc043f21" }
diesel = { git = "https://github.com/lajennylove/diesel", rev = "a07c4b2c20a466ef34f50ca283790f4df20b0699", features = ["mysql", "r2d2", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
dotenvy = "0.15"

[build-dependencies]
propel_compiler = { git = "https://github.com/lajennylove/propel", rev = "71ecd1c0c9676db74ce0c90ea3578a12fc043f21" }

[workspace]
