[package]
name = "rocket-ignite-example"
version = "0.0.0"
edition = "2021"
publish = false
default-run = "rocket-ignite-example"

[dependencies]
# Ignite and Orbit from git, at the revisions the Ignite workspace locks (Ignite main
# 1088789 and Orbit e3b8668). Rocket and Propel come from crates.io, as Ignite resolves them.
ignite-panel = { git = "https://github.com/lajennylove/Ignite", rev = "1088789e9f86a5c87ecb697327173423f51c2240" }
ignite-core = { git = "https://github.com/lajennylove/Ignite", rev = "1088789e9f86a5c87ecb697327173423f51c2240" }
orbit-orm = { git = "https://github.com/lajennylove/Orbit", rev = "e3b8668270cc8c3f2c17b69b9257c442707be1a4" }
rocket = "0.5.2"
propel_rocket = "0.2.0"
propel_runtime = "0.2.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
dotenvy = "0.15"

[build-dependencies]
propel_compiler = "0.2.0"

[workspace]
