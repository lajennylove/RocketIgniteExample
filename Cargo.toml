[package]
name = "rocket-ignite-example"
version = "0.0.0"
edition = "2021"
publish = false
default-run = "rocket-ignite-example"

[dependencies]
ignite-panel = { git = "https://github.com/lajennylove/Ignite", rev = "5d8e03eccccad499b8e316110eaa6928d63719dd" }
ignite-core = { git = "https://github.com/lajennylove/Ignite", rev = "5d8e03eccccad499b8e316110eaa6928d63719dd" }
rocket = { git = "https://github.com/rwf2/Rocket", rev = "3a54d079" }
propel_rocket = { git = "https://github.com/lajennylove/propel", rev = "5c2884f52b2d38eae63fb8eda088b81f19f547fe" }
propel_runtime = { git = "https://github.com/lajennylove/propel", rev = "5c2884f52b2d38eae63fb8eda088b81f19f547fe" }
diesel = { git = "https://github.com/lajennylove/diesel", rev = "a07c4b2c20a466ef34f50ca283790f4df20b0699", features = ["mysql", "r2d2", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
dotenvy = "0.15"

[build-dependencies]
propel_compiler = { git = "https://github.com/lajennylove/propel", rev = "5c2884f52b2d38eae63fb8eda088b81f19f547fe" }

[workspace]
