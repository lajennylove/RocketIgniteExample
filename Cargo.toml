[package]
name = "rocket-ignite-example"
version = "0.0.0"
edition = "2021"
publish = false
default-run = "rocket-ignite-example"

[dependencies]
ignite-panel = { git = "https://github.com/lajennylove/Ignite", rev = "154c17c2218d30b1b03e64bbe78c1b07f5ee79a1" }
ignite-core = { git = "https://github.com/lajennylove/Ignite", rev = "154c17c2218d30b1b03e64bbe78c1b07f5ee79a1" }
rocket = { git = "https://github.com/rwf2/Rocket", rev = "3a54d079" }
propel_rocket = { git = "https://github.com/lajennylove/propel", rev = "81b97ce213bbedc3992823e846f0d6689eeb602d" }
propel_runtime = { git = "https://github.com/lajennylove/propel", rev = "81b97ce213bbedc3992823e846f0d6689eeb602d" }
diesel = { git = "https://github.com/lajennylove/diesel", rev = "a07c4b2c20a466ef34f50ca283790f4df20b0699", features = ["mysql", "r2d2", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
dotenvy = "0.15"

[build-dependencies]
propel_compiler = { git = "https://github.com/lajennylove/propel", rev = "81b97ce213bbedc3992823e846f0d6689eeb602d" }

[workspace]
