[package]
name = "rocket-ignite-example"
version = "0.0.0"
edition = "2021"
publish = false
default-run = "rocket-ignite-example"

[dependencies]
# Ignite, Orbit, Rocket and Propel all come from crates.io.
ignite-panel = "0.3.0"
ignite-core = "0.3.0"
orbit-orm = "0.1.0"
rocket = "0.5.2"
propel_rocket = "0.2.0"
propel_runtime = "0.2.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
dotenvy = "0.15"

[build-dependencies]
propel_compiler = "0.2.0"

[workspace]
