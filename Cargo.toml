[package]
name = "rocket-ignite-example"
version = "0.0.0"
edition = "2021"
publish = false
default-run = "rocket-ignite-example"

[dependencies]
# Ignite from git, at the revision the Ignite main branch is on (d3d1975). Orbit, Rocket and
# Propel come from crates.io, as Ignite resolves them.
ignite-panel = { git = "https://github.com/lajennylove/Ignite", rev = "d3d1975ae107b4e7e7dce92a20f1c83a73428866" }
ignite-core = { git = "https://github.com/lajennylove/Ignite", rev = "d3d1975ae107b4e7e7dce92a20f1c83a73428866" }
orbit-orm = "0.1.0"
rocket = "0.5.2"
propel_rocket = "0.2.0"
propel_runtime = "0.2.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
dotenvy = "0.15"

[build-dependencies]
propel_compiler = "0.2.0"

[workspace]
